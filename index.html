<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Jasa Pembuatan Web - AL Code</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-card">
    <div class="header">
      <span class="badge">Pesan Custom</span>
      <h1>Form Pemesanan Web</h1>
      <p>Pilih spesifikasi dan tuliskan deskripsi website impianmu di sini!</p>
    </div>

    <form id="calcForm">
      <!-- Jenis Website -->
      <div class="form-group">
        <label for="webType">Tipe Website</label>
        <select id="webType" onchange="calculateTotal()">
          <option value="20000">Landing Page / Profil Bisnis (Rp 20.000)</option>
          <option value="35000">Web UMKM / Portofolio Lengkap (Rp 35.000)</option>
          <option value="40000">Toko Online Sederhana (Rp 40.000)</option>
          <option value="DLL">DLL (harga menyesuaikan kebutuhan)</option>
        </select>
      </div>

      <!-- Fitur Tambahan -->
      <div class="form-group">
        <label>Fitur Tambahan (Opsional)</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="30000" class="feature" onchange="calculateTotal()"> Tautan WhatsApp Otomatis (+Rp 30rb)</label>
          <label><input type="checkbox" value="40000" class="feature" onchange="calculateTotal()"> Desain Premium & Responsif (+Rp 40rb)</label>
          <label><input type="checkbox" value="50000" class="feature" onchange="calculateTotal()"> Integrasi Domain (.com) (+Rp 50rb)</label>
        </div>
      </div>
      <!-- ========================================== -->
      <!-- MASUKKAN KODE METODE PEMBAYARAN DI SINI!   -->
      <!-- ========================================== -->
      <div class="form-group">
        <label for="paymentMethod">Pilih Metode Pembayaran</label>
        <select id="paymentMethod">
          <option value="QRIS (Scan Semua E-Wallet/M-Banking)">QRIS ( OVO )</option>
          <option value="Bayar Bertahap (DP 50% dulu)">Bayar Bertahap / DP 50% Di Awal</option>
        </select>
      </div>

      <!-- Kotak Deskripsi Kustom dari Klien -->
      <div class="form-group">
        <label for="clientNote">Deskripsi / Konsep Website Impian Kamu</label>
        <textarea id="clientNote" rows="4" placeholder="Contoh: Saya ingin warna dominan biru, isinya tentang profil usaha kuliner saya, ada menu makanan dan tombol order..."></textarea>
      </div>

      <!-- Kecepatan Pengerjaan -->
      <div class="form-group">
        <label for="speed">Kecepatan Pengerjaan</label>
        <select id="speed" onchange="calculateTotal()">
          <option value="1">Standar (10-15 Hari)</option>
          <option value="1.3">Ekspres (5-7 Hari) (+30%)</option>
        </select>
      </div>
    </form>

    <!-- Total & Tombol WA -->
    <div class="result-box">
      <span>Total Perkiraan Biaya:</span>
      <h2 id="totalPrice">Rp 20.000</h2>
      <button onclick="sendToWhatsApp()" class="btn-wa">📲 KIRIM PESANAN KE WHATSAPP</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
